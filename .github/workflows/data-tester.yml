name: Validate data

on:
  pull_request:
    branches:
    - main
    types: [opened,synchronize]
    paths:
     - 'data/**'
     - '.github/workflows/data-tester.yml'
     - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/go.mod
        cache-dependency-path: src/go.sum
    - name: Generate
      run: |
        make generator
    
